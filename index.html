
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080D18">
<title>TRIPL3 — Basketball, redefined.</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
 --bg:#080D18;--panel:#141D2D;--panel2:#1B2739;
 --line:#29364A;--text:#F6F7FA;--muted:#8E9AAF;
 --accent:#FF6545;--green:#56D9A2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.topbar{height:65px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);background:#080D18F5;position:sticky;top:0;z-index:10}
.logo{font-size:27px;font-weight:950;letter-spacing:-1.5px}
.logo span{color:var(--accent)}
.topright{display:flex;gap:9px;align-items:center}
.roundbtn{background:var(--panel);border:1px solid var(--line);border-radius:11px;color:white;padding:9px 12px}
.shell{max-width:1050px;margin:auto;padding:22px 17px 105px}
.page{display:none}.page.active{display:block}
.kicker{font-size:10px;font-weight:850;letter-spacing:2px;color:var(--accent);text-transform:uppercase}
.title{font-size:32px;letter-spacing:-1.4px;font-weight:900;margin:9px 0 18px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:27px 0 13px;gap:12px}
.section-head h2{font-size:21px;letter-spacing:-.7px;margin:0}
.muted{color:var(--muted)}.small{font-size:12px}
.hero{position:relative;min-height:340px;border-radius:22px;overflow:hidden;background:linear-gradient(130deg,#26334B,#111725)}
.hero-img{position:absolute;width:100%;height:100%;object-fit:cover;object-position:center 20%;opacity:.8}
.hero-shade{position:absolute;inset:0;background:linear-gradient(0deg,#080D18 0%,#080D18A0 32%,transparent 80%)}
.hero-content{position:absolute;bottom:23px;left:22px;right:22px}
.hero h1{font-size:clamp(32px,7vw,53px);font-weight:950;line-height:1;letter-spacing:-2px;margin:10px 0}
.hero p{font-size:14px;color:#E5EAF1;margin:9px 0}
.hero-stats{display:flex;gap:16px;margin-top:15px;font-weight:900;font-size:16px;flex-wrap:wrap}
.hero-stats span{color:var(--accent)}
.hero-placeholder{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;font-weight:950;color:#FFFFFF0B}
.pill{display:inline-flex;align-items:center;gap:6px;background:#FF654522;color:#FF927C;border:1px solid #FF65454A;border-radius:50px;padding:7px 11px;font-size:10px;font-weight:850;letter-spacing:1px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;animation:pulse 1.5s infinite}
@keyframes pulse{50%{opacity:.3}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:11px}
.story{display:flex;gap:14px;align-items:center}
.story-art{width:93px;height:94px;border-radius:13px;background:linear-gradient(140deg,#34415D,#75414A);flex-shrink:0;display:grid;place-items:center;overflow:hidden}
.story-art img{width:100%;height:100%;object-fit:cover}
.story h3{font-size:16px;line-height:1.3;margin:5px 0;font-weight:850}
.story p{font-size:12px;color:var(--muted);margin:5px 0;line-height:1.45}
.story-stat{color:var(--accent);font-size:12px;font-weight:850}
.game-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:7px;scroll-snap-type:x mandatory}
.mini-game{min-width:220px;scroll-snap-align:start;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px}
.mini-game .scoreline{font-size:20px;font-weight:900;margin:13px 0}
.mini-game .names{font-size:12px;color:var(--muted)}
.mini-game .names div{margin:5px 0}
.game-card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:17px;margin:11px 0}
.game-top{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted);margin-bottom:16px}
.game-main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.game-team{display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;font-size:12px;font-weight:750}
.game-team img{width:46px;height:46px;object-fit:contain}
.game-score{font-size:25px;font-weight:950;white-space:nowrap;letter-spacing:-1px}
.game-bottom{text-align:center;font-size:11px;color:var(--muted);margin-top:15px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:5px 0 14px}
.filter{white-space:nowrap;background:var(--panel);border:1px solid var(--line);border-radius:50px;padding:10px 16px;color:var(--muted);font-size:12px;font-weight:750}
.filter.active{background:var(--accent);border-color:var(--accent);color:white}
.datebar{display:flex;align-items:center;gap:9px;margin:15px 0}
.datebar input{flex:1;min-width:0}
input,select{background:var(--panel2);border:1px solid var(--line);color:white;border-radius:12px;padding:12px;width:100%;color-scheme:dark}
.primary{background:var(--accent);color:white;border:0;border-radius:12px;padding:13px 17px;font-weight:850}
.secondary{background:var(--panel2);border:1px solid var(--line);color:white;border-radius:12px;padding:12px 15px}
.player-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.player-card{border-radius:17px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.player-photo{height:160px;background:linear-gradient(145deg,#2D3954,#733D46);display:flex;justify-content:center;align-items:flex-end;overflow:hidden}
.player-photo img{height:100%;max-width:100%;object-fit:contain}
.player-label{padding:12px}
.player-label strong{display:block;font-size:14px}
.player-label small{color:var(--muted);font-size:11px}
.fav-options{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.fav-chip{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:30px;padding:10px 12px;font-size:12px}
.fav-chip.on{border-color:var(--accent);color:white;background:#FF654525}
.field{margin:15px 0}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.status-note{font-size:12px;color:var(--muted);line-height:1.6}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:11px 7px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted)}
td:not(:first-child),th:not(:first-child){text-align:right}
.table-scroll{overflow-x:auto}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#0D1524F7;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:11px 4px max(13px,env(safe-area-inset-bottom));z-index:15}
.bottomnav button{background:none;border:0;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:5px}
.bottomnav button.active{color:var(--accent)}
.bottomnav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty{padding:25px;text-align:center;color:var(--muted);font-size:13px}
.league-tile{display:flex;align-items:center;gap:13px}
.league-tile img{width:40px;height:40px;object-fit:contain}
@media(min-width:700px){
 .hero{min-height:460px}
 .player-grid{grid-template-columns:repeat(4,1fr)}
 .story-art{width:120px;height:105px}
 .bottomnav{left:50%;transform:translateX(-50%);max-width:650px;border:1px solid var(--line);border-radius:18px 18px 0 0}
}
</style>
</head>
<body>

<header class="topbar">
 <div class="logo">TRIPL<span>3</span></div>
 <div class="topright">
  <button class="roundbtn" id="langBtn">EN</button>
  <button class="roundbtn" onclick="go('profile')">⚙</button>
 </div>
</header>

<main class="shell">

<section class="page active" id="home">
 <div class="kicker">YOUR DAILY BASKETBALL</div>
 <div class="section-head">
  <h2>TRIPL3 NOW <span class="dot"></span></h2>
  <span class="muted small" id="feedTime"></span>
 </div>
 <div id="heroArea"></div>

 <div class="section-head">
  <h2 data-es="Lo más destacado" data-en="Top stories">Lo más destacado</h2>
 </div>
 <div id="stories"></div>

 <div class="section-head">
  <h2 data-es="Marcadores" data-en="Scores">Marcadores</h2>
  <button class="secondary" onclick="go('games')" data-es="Ver todos" data-en="See all">Ver todos</button>
 </div>
 <div class="game-strip" id="scoreStrip"></div>

 <div class="section-head">
  <h2 data-es="Tus jugadores" data-en="Your players">Tus jugadores</h2>
 </div>
 <div class="player-grid" id="homePlayers"></div>
</section>

<section class="page" id="games">
 <div class="kicker">GAME CENTER</div>
 <h1 class="title" data-es="Partidos" data-en="Games">Partidos</h1>
 <div class="datebar">
  <button class="secondary" onclick="changeDay(-1)">‹</button>
  <input type="date" id="gameDate" onchange="changeDate(this.value)">
  <button class="secondary" onclick="changeDay(1)">›</button>
  <button class="secondary" onclick="today()" data-es="Hoy" data-en="Today">Hoy</button>
 </div>
 <div class="filters" id="leagueFilters"></div>
 <div class="actions" style="margin:0 0 15px">
  <button class="secondary" id="spoilerButton" onclick="toggleSpoilers()">◉</button>
  <button class="secondary" onclick="refreshAll()">↻</button>
 </div>
 <div id="gameList"></div>
 <div class="section-head"><h2 data-es="Clasificación parcial" data-en="Partial standings">Clasificación parcial</h2></div>
 <p class="status-note" data-es="Solo partidos guardados. No es la clasificación oficial." data-en="Stored games only. Not official standings.">Solo partidos guardados. No es la clasificación oficial.</p>
 <div class="card table-scroll" id="standings"></div>
</section>

<section class="page" id="favorites">
 <div class="kicker">PERSONALIZED</div>
 <h1 class="title" data-es="Mis favoritos" data-en="My favorites">Mis favoritos</h1>
 <div class="section-head"><h2 data-es="Jugadores" data-en="Players">Jugadores</h2></div>
 <div class="player-grid" id="favoritePlayers"></div>
 <div class="fav-options" id="playerOptions"></div>
 <div class="section-head"><h2 data-es="Equipos" data-en="Teams">Equipos</h2></div>
 <div class="fav-options" id="teamOptions"></div>
 <div class="section-head"><h2 data-es="Ligas" data-en="Leagues">Ligas</h2></div>
 <div class="fav-options" id="leagueOptions"></div>
 <p class="status-note" id="favoriteMessage"></p>
</section>

<section class="page" id="profile">
 <div class="kicker">MY TRIPL3</div>
 <h1 class="title" data-es="Perfil" data-en="Profile">Perfil</h1>

 <div class="card">
  <h3 data-es="Mi cuenta" data-en="My account">Mi cuenta</h3>
  <p class="status-note" id="authStatus"></p>
  <div id="authForm">
   <div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div>
   <div class="field"><label data-es="Contraseña" data-en="Password">Contraseña</label><input id="password" type="password" autocomplete="current-password"></div>
   <div class="actions">
    <button class="primary" onclick="login()" data-es="Entrar" data-en="Sign in">Entrar</button>
    <button class="secondary" onclick="signup()" data-es="Registrarme" data-en="Sign up">Registrarme</button>
   </div>
  </div>
  <button class="secondary" id="logoutButton" onclick="logout()" style="display:none" data-es="Cerrar sesión" data-en="Sign out">Cerrar sesión</button>
  <p class="status-note" id="authMessage"></p>
 </div>

 <div class="card">
  <h3 data-es="Preferencias" data-en="Preferences">Preferencias</h3>
  <div class="field">
   <label data-es="Idioma" data-en="Language">Idioma</label>
   <select id="languageSelect" onchange="setLanguage(this.value)">
    <option value="es">Español</option><option value="en">English</option>
   </select>
  </div>
  <div class="field">
   <label data-es="Zona horaria" data-en="Time zone">Zona horaria</label>
   <select id="timezoneSelect" onchange="setTimezone(this.value)">
    <option value="Europe/Madrid">Madrid</option>
    <option value="Europe/Vienna">Viena</option>
    <option value="Europe/London">London</option>
    <option value="America/New_York">New York</option>
    <option value="America/Los_Angeles">Los Angeles</option>
   </select>
  </div>
  <button class="primary" onclick="savePreferences()" data-es="Guardar" data-en="Save">Guardar</button>
 </div>
</section>

</main>

<nav class="bottomnav">
 <button class="active" data-page="home" onclick="go('home')">
  <svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/></svg>
  <span data-es="Inicio" data-en="Home">Inicio</span>
 </button>
 <button data-page="games" onclick="go('games')">
  <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
  <span data-es="Partidos" data-en="Games">Partidos</span>
 </button>
 <button data-page="favorites" onclick="go('favorites')">
  <svg viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 7 1-5.1 5 .9 7-5.9-3.2-5.9 3.2.9-7-5.1-5 7-1z"/></svg>
  <span data-es="Favoritos" data-en="Favorites">Favoritos</span>
 </button>
 <button data-page="profile" onclick="go('profile')">
  <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 3-8 8-8s8 3 8 8"/></svg>
  <span data-es="Perfil" data-en="Profile">Perfil</span>
 </button>
</nav>

<script>
const URL_SUPABASE="https://xqzbvjbmospjkdaupjhv.supabase.co";
const PUBLIC_KEY="sb_publishable_g4LtRSSO_AkMFHVnDa5ftQ_veppfOtX";
const db=window.supabase.createClient(URL_SUPABASE,PUBLIC_KEY);
const $=id=>document.getElementById(id);
const leagues={nba:"NBA",euroleague:"EuroLeague",acb:"ACB"};
const leagueList=["NBA","EuroLeague","ACB"];
const playerCatalog=[
 {name:"Luka Dončić",nba:"1629029",team:"Lakers"},
 {name:"Victor Wembanyama",nba:"1641705",team:"Spurs"},
 {name:"Stephen Curry",nba:"201939",team:"Warriors"},
 {name:"LeBron James",nba:"2544",team:"Lakers"}
];
const teamCatalog=["Lakers","Celtics","Spurs","Warriors","Real Madrid","Barça","Valencia Basket","Olympiacos"];
const teamAliases={
 Lakers:["lakers"],Celtics:["celtics"],Spurs:["spurs"],Warriors:["warriors"],
 "Real Madrid":["real madrid"],"Barça":["barcelona","barca"],
 "Valencia Basket":["valencia"],Olympiacos:["olympiacos"]
};

let state;
try{
 state={
  lang:"es",timezone:"Europe/Vienna",hideScores:false,
  favoritePlayers:["Luka Dončić"],favoriteTeams:["Lakers"],
  favoriteLeagues:[...leagueList],
  ...JSON.parse(localStorage.getItem("tripl3_premium")||"{}")
 };
}catch{
 state={lang:"es",timezone:"Europe/Vienna",hideScores:false,
  favoritePlayers:["Luka Dončić"],favoriteTeams:["Lakers"],
  favoriteLeagues:[...leagueList]};
}
for(const key of ["favoritePlayers","favoriteTeams","favoriteLeagues"]){
 if(!Array.isArray(state[key]))state[key]=[];
}

let user=null;
let allGames=[],stats=[],dayGames=[];
let selectedLeague="NBA";
let selectedDay="";
let feedError="";
let gamesError="";
let feedLoaded=false;
let dayLoaded=false;
let feedRequest=0;
let dayRequest=0;
let favoritesBusy=false;
let favoritesQueued=false;

function tr(es,en){return state.lang==="es"?es:en}
function persist(){localStorage.setItem("tripl3_premium",JSON.stringify(state))}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function norm(v){return String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g,"").trim()}
function matchTeam(name,fav){return(teamAliases[fav]||[fav]).some(a=>norm(name).includes(norm(a)))}
function favoriteGame(g){return state.favoriteTeams.some(t=>matchTeam(g.home_team,t)||matchTeam(g.away_team,t))}
function favoritePlayer(name){return state.favoritePlayers.some(p=>norm(p)===norm(name))}
function playerInfo(name){return playerCatalog.find(p=>norm(p.name)===norm(name))}
function photo(name){const p=playerInfo(name);return p?`https://cdn.nba.com/headshots/nba/latest/1040x760/${p.nba}.png`:""}
function gameStats(g){return stats.filter(s=>String(s.provider_game_id)===String(g.provider_game_id))}
function points(s){return Number(s?.points||0)}
function rebounds(s){return Number(s?.rebounds||0)}
function assists(s){return Number(s?.assists||0)}
function playerScore(s){
 let score=points(s)+rebounds(s)*1.2+assists(s)*1.5;
 if(points(s)>=30)score+=9;
 if([points(s),rebounds(s),assists(s)].filter(n=>n>=10).length>=2)score+=8;
 if(favoritePlayer(s.player_name))score+=5;
 return score;
}
function leaders(g){return gameStats(g).filter(s=>s.player_name).sort((a,b)=>playerScore(b)-playerScore(a))}
function gameRank(g){
 let score=g.status==="live"?45:0;
 if(favoriteGame(g))score+=20;
 if(g.home_score!=null&&g.away_score!=null&&Math.abs(g.home_score-g.away_score)<=5)score+=12;
 const leader=leaders(g)[0];if(leader)score+=playerScore(leader);
 return score;
}
function zoneDay(date){
 const d=new Date(date);if(Number.isNaN(d.getTime()))return "";
 const parts=new Intl.DateTimeFormat("en-CA",{timeZone:state.timezone,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(d);
 const get=t=>parts.find(x=>x.type===t)?.value;
 return `${get("year")}-${get("month")}-${get("day")}`;
}
function currentDay(){return zoneDay(new Date())}
function dateLabel(value){
 try{return new Intl.DateTimeFormat(state.lang==="es"?"es-ES":"en-GB",
 {timeZone:state.timezone,day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).format(new Date(value))}
 catch{return ""}
}
function translate(){
 document.documentElement.lang=state.lang;
 document.querySelectorAll("[data-es][data-en]").forEach(e=>e.textContent=e.dataset[state.lang]);
 $("langBtn").textContent=state.lang==="es"?"EN":"ES";
 $("languageSelect").value=state.lang;
 $("timezoneSelect").value=state.timezone;
}
function go(id){
 document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id===id));
 document.querySelectorAll(".bottomnav button").forEach(b=>b.classList.toggle("active",b.dataset.page===id));
 window.scrollTo(0,0);
}
function setLanguage(v){state.lang=v;persist();render();savePreferences()}
function setTimezone(v){state.timezone=v;selectedDay=currentDay();persist();render();loadDay();savePreferences()}
$("langBtn").onclick=()=>setLanguage(state.lang==="es"?"en":"es");

function playerCard(p){
 return `<div class="player-card">
  <div class="player-photo"><img src="${photo(p.name)}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none'"></div>
  <div class="player-label"><strong>${esc(p.name)}</strong><small>${esc(p.team)}</small></div>
 </div>`;
}
function renderPlayers(){
 const chosen=playerCatalog.filter(p=>state.favoritePlayers.includes(p.name));
 const html=chosen.map(playerCard).join("")||`<div class="empty">${tr("Añade tus jugadores favoritos","Add your favorite players")}</div>`;
 $("homePlayers").innerHTML=html;
 $("favoritePlayers").innerHTML=html;
}

function gameScore(g){
 if(state.hideScores)return "•• : ••";
 if(g.home_score==null||g.away_score==null)return "VS";
 return `${g.home_score} : ${g.away_score}`;
}
function gameState(g){
 return g.status==="live"?"LIVE":g.status==="finished"?"FINAL":
 g.status==="scheduled"?tr("PRÓXIMO","UPCOMING"):
 g.status==="postponed"?tr("APLAZADO","POSTPONED"):
 g.status==="cancelled"?tr("CANCELADO","CANCELLED"):"—";
}
function miniGame(g){
 return `<div class="mini-game">
  <div class="kicker">${esc(leagues[g.league_id]||g.league_id)} · ${gameState(g)}</div>
  <div class="scoreline">${gameScore(g)}</div>
  <div class="names"><div>${esc(g.home_team)}</div><div>${esc(g.away_team)}</div></div>
 </div>`;
}
function fullGame(g){
 const team=(name,logo)=>`<div class="game-team">
  ${/^https:\/\//i.test(logo||"")?`<img src="${esc(logo)}" alt="" loading="lazy">`:""}
  <span>${esc(name)}</span></div>`;
 return `<div class="game-card">
  <div class="game-top"><span>${esc(leagues[g.league_id]||"")}</span>
   <span>${g.status==="live"?'<span class="dot"></span> ':""}${gameState(g)}</span></div>
  <div class="game-main">
   ${team(g.home_team,g.home_team_logo)}
   <div class="game-score">${gameScore(g)}</div>
   ${team(g.away_team,g.away_team_logo)}
  </div>
  <div class="game-bottom">${esc(dateLabel(g.game_date))}</div>
 </div>`;
}
function scoreSentence(g){
 if(g.home_score==null||g.away_score==null)return "";
 const h=g.home_score,a=g.away_score;
 if(g.status==="live"){
  if(h===a)return tr(`Empate a ${h}.`,`Tied at ${h}.`);
  const winner=h>a?g.home_team:g.away_team;
  return tr(`${winner} lidera por ${Math.abs(h-a)} puntos.`,`${winner} leads by ${Math.abs(h-a)}.`);
 }
 if(h===a)return tr("Marcador empatado en los datos.","Score tied in available data.");
 const winner=h>a?g.home_team:g.away_team;
 return tr(`${winner} gana ${Math.max(h,a)}-${Math.min(h,a)}.`,`${winner} wins ${Math.max(h,a)}-${Math.min(h,a)}.`);
}
function statline(s){return `${points(s)} PTS · ${rebounds(s)} REB · ${assists(s)} AST`}
function playerHeadline(s){
 if(!s)return "";
 if(points(s)>=30)return tr(`${s.player_name} se luce con ${points(s)} puntos`,`${s.player_name} drops ${points(s)} points`);
 if([points(s),rebounds(s),assists(s)].filter(n=>n>=10).length>=3)return `${s.player_name}: TRIPLE-DOUBLE`;
 if([points(s),rebounds(s),assists(s)].filter(n=>n>=10).length>=2)return `${s.player_name}: DOUBLE-DOUBLE`;
 return tr(`${s.player_name} destaca`,`${s.player_name} stands out`);
}
function storyData(g){
 const s=leaders(g)[0];
 return {
  game:g,stat:s,
  title:s?playerHeadline(s):`${g.home_team} vs ${g.away_team}`,
  subtitle:scoreSentence(g),
  label:`${leagues[g.league_id]||""} · ${gameState(g)}`
 };
}
function renderBriefing(){
 const eligible=allGames.filter(g=>state.favoriteLeagues.includes(leagues[g.league_id]));
 const live=eligible.filter(g=>g.status==="live").sort((a,b)=>gameRank(b)-gameRank(a));
 const finished=eligible.filter(g=>g.status==="finished"&&g.home_score!=null&&g.away_score!=null);
 const recent=finished.sort((a,b)=>new Date(b.game_date)-new Date(a.game_date)).slice(0,35)
  .sort((a,b)=>gameRank(b)-gameRank(a));
 const featured=live.length?live[0]:recent[0];
 const extras=live.length
  ? [...live.slice(1,3),...recent.slice(0,2)]
  : recent.slice(1,4);

 if(!featured){
  $("heroArea").innerHTML=`<div class="hero"><div class="hero-placeholder">3</div>
   <div class="hero-content"><span class="pill">TRIPL3 NOW</span>
   <h1>${tr("EL BASKET NO PARA","BASKETBALL NEVER STOPS")}</h1>
   <p>${feedError?esc(feedError):feedLoaded?tr("Esperando nuevos resultados.","Waiting for new results."):tr("Cargando...","Loading...")}</p></div></div>`;
  $("stories").innerHTML="";
  $("scoreStrip").innerHTML="";
  $("feedTime").textContent="";
  return;
 }
 const story=storyData(featured);
 const image=story.stat?photo(story.stat.player_name):"";
 $("heroArea").innerHTML=`<div class="hero">
  <div class="hero-placeholder">3</div>
  ${image?`<img class="hero-img" src="${esc(image)}" alt="" onerror="this.style.display='none'">`:""}
  <div class="hero-shade"></div>
  <div class="hero-content">
   <span class="pill">${featured.status==="live"?'<span class="dot"></span> LIVE':"TRIPL3 NOW"} · ${esc(leagues[featured.league_id]||"")}</span>
   <h1>${esc(story.title)}</h1>
   <p>${esc(story.subtitle)}</p>
   ${story.stat?`<div class="hero-stats"><span>${statline(story.stat)}</span></div>`:""}
  </div></div>`;
 $("feedTime").textContent=dateLabel(featured.game_date);
 $("stories").innerHTML=extras.map(g=>{
  const d=storyData(g),img=d.stat?photo(d.stat.player_name):"";
  return `<div class="card story">
   <div class="story-art">${img?`<img src="${esc(img)}" alt="" loading="lazy" onerror="this.style.display='none'">`:'<span style="font-size:35px;font-weight:900;opacity:.3">3</span>'}</div>
   <div><div class="kicker">${esc(d.label)}</div><h3>${esc(d.title)}</h3>
   <p>${esc(d.subtitle)}</p>
   ${d.stat?`<div class="story-stat">${statline(d.stat)}</div>`:""}
   </div></div>`;
 }).join("")||`<div class="empty">${tr("Más historias próximamente.","More stories coming soon.")}</div>`;
 const recentScores=[...eligible].filter(g=>g.status==="live"||g.status==="finished")
  .sort((a,b)=>new Date(b.game_date)-new Date(a.game_date)).slice(0,10);
 $("scoreStrip").innerHTML=recentScores.map(miniGame).join("")||
 `<div class="empty">${tr("Sin marcadores recientes","No recent scores")}</div>`;
}

function renderStandings(){
 const map=new Map();
 for(const g of allGames){
  if(leagues[g.league_id]!==selectedLeague||g.status!=="finished")continue;
  const h=Number(g.home_score),a=Number(g.away_score);
  if(g.home_score==null||g.away_score==null||!Number.isFinite(h)||!Number.isFinite(a)||h===a)continue;
  for(const [name,scored,against] of [[g.home_team,h,a],[g.away_team,a,h]]){
   if(!map.has(name))map.set(name,{name,p:0,w:0,l:0,d:0});
   const r=map.get(name);r.p++;r.w+=+(scored>against);r.l+=+(scored<against);r.d+=scored-against;
  }
 }
 const rows=[...map.values()].sort((a,b)=>b.w-a.w||b.d-a.d);
 $("standings").innerHTML=rows.length?`<table><thead><tr><th>${tr("Equipo","Team")}</th><th>PJ</th><th>V</th><th>D</th><th>+/-</th></tr></thead>
 <tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.l}</td><td>${r.d}</td></tr>`).join("")}</tbody></table>`:
 `<div class="empty">${tr("Sin datos suficientes","Not enough data")}</div>`;
}
function renderGames(){
 $("gameDate").value=selectedDay;
 $("leagueFilters").innerHTML=leagueList.map(l=>`<button class="filter ${selectedLeague===l?"active":""}" onclick="selectLeague('${l}')">${l}</button>`).join("");
 const games=dayGames.filter(g=>leagues[g.league_id]===selectedLeague&&zoneDay(g.game_date)===selectedDay);
 $("gameList").innerHTML=games.length?games.map(fullGame).join(""):
 `<div class="empty">${gamesError?esc(gamesError):dayLoaded?tr("No hay partidos para este día.","No games on this date."):tr("Cargando...","Loading...")}</div>`;
 $("spoilerButton").textContent=state.hideScores?tr("Mostrar puntos","Show scores"):tr("Ocultar puntos","Hide scores");
 renderStandings();
}
function selectLeague(l){selectedLeague=l;renderGames()}
function changeDate(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return;selectedDay=v;loadDay()}
function changeDay(delta){const d=new Date(selectedDay+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+delta);selectedDay=d.toISOString().slice(0,10);loadDay()}
function today(){selectedDay=currentDay();loadDay()}
function toggleSpoilers(){state.hideScores=!state.hideScores;persist();renderGames();renderBriefing()}

function optionButtons(id,items,key){
 $(id).innerHTML=items.map(item=>`<button class="fav-chip ${state[key].includes(item)?"on":""}"
  data-value="${esc(item)}">${state[key].includes(item)?"✓ ":"+ "}${esc(item)}</button>`).join("");
 $(id).querySelectorAll("button").forEach(b=>{
  b.onclick=()=>{
   const item=b.dataset.value;
   state[key]=state[key].includes(item)?state[key].filter(x=>x!==item):[...state[key],item];
   persist();render();syncFavorites();
  };
 });
}
function renderFavorites(){
 optionButtons("playerOptions",playerCatalog.map(p=>p.name),"favoritePlayers");
 optionButtons("teamOptions",teamCatalog,"favoriteTeams");
 optionButtons("leagueOptions",leagueList,"favoriteLeagues");
}
function render(){
 translate();renderPlayers();renderBriefing();renderGames();renderFavorites();updateAuth();
}

const gameFields="provider_game_id,league_id,home_team,away_team,home_team_logo,away_team_logo,home_score,away_score,game_date,status";
const statFields="provider_game_id,provider_player_id,player_name,points,rebounds,assists,threepoints_made,updated_at";

async function loadFeed(){
 const seq=++feedRequest;
 const since=new Date();since.setUTCDate(since.getUTCDate()-7);
 try{
  const {data,error}=await db.from("games").select(gameFields)
   .gte("game_date",since.toISOString()).order("game_date",{ascending:false}).limit(500);
  if(error)throw error;
  if(seq!==feedRequest)return;
  const ids=[...new Set((data||[]).filter(g=>["live","finished"].includes(g.status))
   .map(g=>Number(g.provider_game_id)).filter(Number.isFinite))];
  const found=[];
  for(let i=0;i<ids.length;i+=25){
   const {data:rows,error:e}=await db.from("player_game_stats").select(statFields)
    .eq("provider","api-sports").in("provider_game_id",ids.slice(i,i+25)).limit(1000);
   if(e)throw e;
   found.push(...(rows||[]));
  }
  if(seq!==feedRequest)return;
  allGames=data||[];stats=found;feedError="";feedLoaded=true;
  renderBriefing();renderStandings();
 }catch(e){
  if(seq!==feedRequest)return;
  feedError=e.message||String(e);feedLoaded=true;
  console.error(e);renderBriefing();
 }
}
async function loadDay(){
 const seq=++dayRequest;
 const center=new Date(selectedDay+"T12:00:00Z");
 const lower=new Date(center),upper=new Date(center);
 lower.setUTCDate(lower.getUTCDate()-2);upper.setUTCDate(upper.getUTCDate()+2);
 try{
  const {data,error}=await db.from("games").select(gameFields)
   .gte("game_date",lower.toISOString()).lt("game_date",upper.toISOString())
   .order("game_date",{ascending:true}).limit(500);
  if(error)throw error;
  if(seq!==dayRequest)return;
  dayGames=data||[];gamesError="";dayLoaded=true;
 }catch(e){
  if(seq!==dayRequest)return;
  gamesError=e.message||String(e);dayLoaded=true;console.error(e);
 }
 renderGames();
}
async function refreshAll(){await Promise.all([loadFeed(),loadDay()])}

/* AUTH */
function updateAuth(){
 $("authForm").style.display=user?"none":"block";
 $("logoutButton").style.display=user?"block":"none";
 $("authStatus").textContent=user?user.email:tr("Entra para sincronizar tus favoritos.","Sign in to sync favorites.");
}
async function signup(){
 const email=$("email").value.trim(),password=$("password").value;
 if(!email||password.length<6){$("authMessage").textContent=tr("Introduce email y contraseña de 6 caracteres mínimo.","Enter email and a password of at least 6 characters.");return}
 const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:"https://martina9804.github.io/tripl3/"}});
 $("authMessage").textContent=error?error.message:data.session?tr("Cuenta creada.","Account created."):tr("Confirma tu email.","Confirm your email.");
}
async function login(){
 const {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
 $("authMessage").textContent=error?error.message:tr("Conectada.","Signed in.");
}
async function logout(){
 const {error}=await db.auth.signOut();
 if(error)$("authMessage").textContent=error.message;
}
async function savePreferences(){
 persist();if(!user)return;
 const {error}=await db.from("profiles").upsert({
  id:user.id,language:state.lang,timezone:state.timezone,updated_at:new Date().toISOString()
 },{onConflict:"id"});
 $("authMessage").textContent=error?error.message:tr("Guardado.","Saved.");
}
async function loadUserData(){
 if(!user)return;
 const uid=user.id;
 const {data:profile,error:pe}=await db.from("profiles").select("language,timezone").eq("id",uid).maybeSingle();
 if(pe){$("authMessage").textContent=pe.message;return}
 if(!user||user.id!==uid)return;
 if(profile){state.lang=profile.language||"es";state.timezone=profile.timezone||"Europe/Vienna"}
 const {data:favs,error:fe}=await db.from("favorites")
  .select("team_id,player_id,teams(name),players(name)").eq("user_id",uid);
 if(fe){$("authMessage").textContent=fe.message;return}
 if(!user||user.id!==uid)return;
 if(favs){
  state.favoriteTeams=favs.filter(f=>f.teams).map(f=>f.teams.name).filter(n=>teamCatalog.includes(n));
  state.favoritePlayers=favs.filter(f=>f.players).map(f=>f.players.name).filter(n=>playerCatalog.some(p=>p.name===n));
 }
 persist();selectedDay=currentDay();render();loadDay();
}
async function syncFavorites(){
 if(!user)return;
 if(favoritesBusy){favoritesQueued=true;return}
 favoritesBusy=true;
 $("favoriteMessage").textContent=tr("Guardando...","Saving...");
 try{
  const {data:teams,error:te}=await db.from("teams").select("id,name").in("name",state.favoriteTeams.length?state.favoriteTeams:["__none__"]);
  if(te)throw te;
  const {data:players,error:pe}=await db.from("players").select("id,name").in("name",state.favoritePlayers.length?state.favoritePlayers:["__none__"]);
  if(pe)throw pe;
  const records=[...(teams||[]).map(x=>({user_id:user.id,team_id:x.id})),
   ...(players||[]).map(x=>({user_id:user.id,player_id:x.id}))];
  const {error:de}=await db.from("favorites").delete().eq("user_id",user.id);
  if(de)throw de;
  if(records.length){
   const {error:ie}=await db.from("favorites").insert(records);
   if(ie)throw ie;
  }
  $("favoriteMessage").textContent=tr("Favoritos guardados.","Favorites saved.");
 }catch(e){$("favoriteMessage").textContent=e.message}
 finally{
  favoritesBusy=false;
  if(favoritesQueued){favoritesQueued=false;syncFavorites()}
 }
}
db.auth.onAuthStateChange((event,session)=>{
 const previous=user?.id;
 user=session?.user||null;
 updateAuth();
 if(user&&user.id!==previous)setTimeout(loadUserData,0);
});
async function init(){
 selectedDay=currentDay();render();
 await refreshAll();
 const {data,error}=await db.auth.getSession();
 if(error)$("authMessage").textContent=error.message;
 user=data?.session?.user||null;updateAuth();
 if(user)await loadUserData();
}
init();
setInterval(()=>{if(!document.hidden)refreshAll()},30000);
</script>
